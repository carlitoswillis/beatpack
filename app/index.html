<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beatpack belt</title>
<style>
@font-face { font-family: "VCR OSD Mono"; src: url("/fonts/VCR_OSD_MONO_1.001.ttf") format("truetype"); font-display: block; }
@font-face { font-family: "VT323"; src: url("/fonts/VT323-Regular.ttf") format("truetype"); }
:root {
  /* the 2021 canvas: black ground, light ink, one hairline */
  --ground: #000000;
  --surface: #0b0b0b;
  --line: #2a2a2a;
  --ink: #e6e6e6;
  --muted: #8c8c8c;
  --signal: #ffb454;   /* only the item that is running */
  --danger: #e5675a;
  --mono: "VCR OSD Mono", "VT323", ui-monospace, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  /* scale 1.25 from 13: 11 / 13 / 16 / 20 / 32 */
  --t-micro: 11px; --t-body: 13px; --t-sub: 16px; --t-title: 20px; --t-display: 32px;
  --u: 4px;
  --edge: 32px;
  --drawer: 36px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); }
body { font: 400 var(--t-body)/1.45 var(--sans); padding-bottom: calc(var(--drawer) + 8 * var(--u)); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: var(--edge) 0 calc(6 * var(--u)); margin: 0 var(--edge); max-width: calc(1240px - 2 * var(--edge)); border-bottom: 1px solid var(--line); }
.name { font: var(--t-display)/1 var(--mono); letter-spacing: 0.02em; margin: 0; font-weight: 400; }
.status { color: var(--muted); font-size: var(--t-body); }
.status b { color: var(--ink); font-weight: 400; }

main { padding: 0 var(--edge); max-width: 1240px; }
.grid { display: grid; grid-template-columns: 56px minmax(150px, 200px) minmax(320px, 640px) 168px; column-gap: calc(6 * var(--u)); align-items: start; }
.heads { padding: calc(4 * var(--u)) 0 calc(2 * var(--u)); color: var(--muted); font-size: var(--t-micro); }
.heads .track span { padding-left: 0; }
.track { display: grid; grid-template-columns: repeat(4, 1fr); }

.row { padding: calc(4 * var(--u)) 0; }
.row + .row { border-top: 1px solid #141414; }
.row.st-posted { opacity: .5; }
.row.drag { outline: 1px dashed var(--ink); outline-offset: -1px; }

.thumb, .block { outline: 1px solid var(--line); outline-offset: -1px; }
.thumb { width: 56px; height: 100px; display: block; object-fit: cover; background: var(--surface); }
.block { width: 56px; height: 100px; display: flex; align-items: flex-end; padding: 6px; font: 10px/1.1 var(--mono); word-break: break-all; }

.tb { font-family: var(--mono); padding-top: 2px; }
.tb .t { font-size: var(--t-title); line-height: 1.1; text-transform: uppercase; margin-bottom: calc(2 * var(--u)); overflow-wrap: anywhere; }
.tb .l { font-size: var(--t-body); line-height: 1.35; color: var(--ink); }
.tb .l.dim { color: var(--muted); }

/* the belt: a hairline through four stations; reached stretch in ink */
.station { position: relative; min-height: 64px; padding-top: 6px; }
.station::after { content: ""; position: absolute; left: 12px; right: 0; top: 11px; height: 1px; background: var(--line); }
.station:nth-child(4)::after { display: none; }
.station.passed::after { background: var(--muted); }
.mark { position: relative; z-index: 1; display: block; width: 11px; height: 11px; border: 1px solid var(--line); background: var(--ground); }
.passed .mark { background: var(--muted); border-color: var(--muted); }
.here .mark { background: var(--ink); border-color: var(--ink); }
.run .mark { background: var(--signal); border-color: var(--signal); animation: pulse 1.1s ease-in-out infinite; }
.fail .mark { border-color: var(--danger); background:
  linear-gradient(45deg, transparent 45%, var(--danger) 45% 55%, transparent 55%),
  linear-gradient(-45deg, transparent 45%, var(--danger) 45% 55%, transparent 55%); }
.note { display: block; margin-top: calc(2 * var(--u)); font-size: var(--t-micro); color: var(--muted); line-height: 1.35; padding-right: 8px; }
.note .n { font: var(--t-body)/1 var(--mono); color: var(--ink); }
.run .note, .run .note .n { color: var(--signal); }
.fail .note { color: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .run .mark { animation: none; } }

.err { grid-column: 1 / -1; margin-top: calc(2 * var(--u)); font-size: var(--t-micro); color: var(--danger); overflow-wrap: anywhere; }

.act { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding-top: 0; }
.btn { appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--ground); padding: 7px 12px; cursor: pointer; text-align: center; }
.btn:hover { background: #fff; }
.btn:disabled, .btn.quiet:disabled { background: transparent; color: var(--muted); border-color: var(--line); cursor: default; }
.btn.quiet { background: transparent; color: var(--ink); }
.drop { border: 1px dashed var(--muted); color: var(--muted); padding: 10px 12px; font-size: var(--t-micro); line-height: 1.4; }
.drop label { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop.busy { border-style: solid; border-color: var(--signal); color: var(--signal); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 2px 0; text-decoration: underline; text-underline-offset: 2px; }
.btn.link:hover { color: var(--ink); background: none; }
.cap { color: var(--muted); font-size: var(--t-micro); }

.empty { max-width: 680px; padding: calc(16 * var(--u)) 0; }
.empty p { font-size: var(--t-sub); margin: 0 0 calc(4 * var(--u)); }
.empty code { display: inline-block; font: var(--t-body)/1.5 var(--sans); background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; user-select: all; }
.empty .cap { margin-top: calc(4 * var(--u)); }

/* the log drawer */
.drawer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.drawer summary { list-style: none; cursor: pointer; height: var(--drawer); display: flex; align-items: center; gap: 12px; padding: 0 var(--edge); color: var(--muted); font-size: var(--t-micro); }
.drawer summary::-webkit-details-marker { display: none; }
.drawer summary .k { color: var(--ink); }
.drawer summary .last { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.drawer.running summary .k { color: var(--signal); }
.drawer pre { margin: 0; height: 34vh; overflow: auto; padding: 4px var(--edge) 16px; font: var(--t-micro)/1.6 var(--sans); color: var(--muted); white-space: pre-wrap; }
.drawer pre .cmd { color: var(--ink); }
.drawer pre .bad { color: var(--danger); }

@media (max-width: 760px) {
  :root { --edge: 16px; }
  .grid { grid-template-columns: 56px 1fr; row-gap: 12px; }
  .heads { display: none; }
  .track, .act { grid-column: 1 / 3; }
  .station { height: auto; padding-bottom: 8px; }
}
</style>
</head>
<body>
<header>
  <h1 class="name" id="producer">beatpack</h1>
  <div class="status" id="status" aria-live="polite"></div>
</header>
<main id="belt"></main>
<details class="drawer" id="drawer">
  <summary><span class="k" id="logk">log</span><span class="last" id="loglast">nothing has run yet</span><span id="logn"></span></summary>
  <pre id="log" aria-live="polite"></pre>
</details>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, clockSkew = 0, stateTimer = null, logNext = 0, logCount = 0, uploading = {};

async function loadState() {
  clearTimeout(stateTimer);
  try {
    const r = await fetch("/api/state");
    S = await r.json();
    clockSkew = Date.now() / 1000 - S.now;
    render();
  } catch (e) { $("#status").textContent = "The beatpack server is not answering. Start it with: python3 beatpack.py serve"; }
  stateTimer = setTimeout(loadState, S && S.job ? 1500 : 8000);
}

function elapsed() {
  if (!S || !S.job) return "";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - clockSkew - S.job.started));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function render() {
  $("#producer").textContent = S.producer;
  document.title = `${S.producer} belt`;
  $("#status").innerHTML = esc(S.status_line).replace(/(\d{4}-\d{2}-\d{2})/, "<b>$1</b>");
  const belt = $("#belt");
  if (S.empty) {
    belt.innerHTML = `<div class="empty">
      <p>Nothing on the belt yet. Cut loops from the sets you starred in ableton-library:</p>
      <code>python3 beatpack.py loops --list candidates</code>
      ${S.config.catalog ? "" : `<div class="cap">The catalog was not found. Scan your projects in ableton-library first.</div>`}</div>`;
    return;
  }
  const heads = `<div class="grid heads" aria-hidden="true"><span></span><span></span>
    <div class="track">${S.stations.map(s => `<span>${s}</span>`).join("")}</div><span></span></div>`;
  belt.innerHTML = heads + S.rows.map(rowHtml).join("");
  for (const el of belt.querySelectorAll(".row")) wire(el);
}

function stationHtml(r, i) {
  let cls = "station", note = "";
  const reached = r.state === "posted" ? 3 : r.station;
  if (i < reached) cls += " passed";
  if (r.state === "rendering" && i === r.target) {
    cls += " run";
    note = `${i === 1 ? "rendering" : "running"} <span class="n elapsed">${elapsed()}</span>`;
  } else if (r.state === "failed" && i === r.target) {
    cls += " fail"; note = "failed";
  } else if (i === reached) {
    cls += " here";
    if (i === 0 && !r.has_recording && r.status === "loop") note = "waiting for the screen recording";
    if (i === 3) note = r.posted_at ? `posted <span class="n">${esc(r.posted_at)}</span>` : "posted";
  }
  if (i === 3 && reached < 3 && r.queue_date && !note) note = `post on <span class="n">${esc(r.queue_date)}</span>`;
  return `<div class="${cls}"><span class="mark"></span>${note ? `<span class="note">${note}</span>` : ""}</div>`;
}

function actionHtml(r) {
  if (r.state === "rendering") return `<button class="btn" disabled>${esc(r.action ? r.action.label : "Working")}</button>`;
  if (uploading[r.slug]) return `<div class="drop busy">Copying ${esc(uploading[r.slug])} to the inbox</div>`;
  const busy = !!S.job;
  let out = "";
  // Only the next clip to post gets the filled button; later posts wait their turn.
  const later = r.action && r.action.cmd === "posted" && S.next_slug && S.next_slug !== r.slug;
  if (r.action) out += `<button class="btn${later ? " quiet" : ""}" data-run='${esc(JSON.stringify(r.action))}' ${busy ? "disabled" : ""}>${esc(r.action.label)}</button>`;
  if (r.status === "loop" && !r.has_recording)
    out += `<div class="drop">Drop the screen recording here, or <label>choose a file<input type="file" accept=".mov,.mp4,.m4v,video/*" data-slug="${esc(r.slug)}"></label>. It is saved in the inbox as ${esc(r.slug)}.</div>`;
  if (r.state === "queued" && r.caption) out += `<button class="btn link" data-copy="${esc(r.caption)}">Copy caption</button>`;
  return out;
}

function rowHtml(r) {
  const thumb = r.thumb
    ? `<img class="thumb" src="${esc(r.thumb)}" alt="First frame of the ${esc(r.title)} clip">`
    : `<div class="block" style="background:${esc(r.color)};color:${lum(r.color) < .35 ? "#e6e6e6" : "#1a1a1a"}">${esc(r.slug)}</div>`;
  return `<section class="grid row st-${esc(r.state)}" data-slug="${esc(r.slug)}" aria-label="${esc(r.title)}, ${esc(r.state)}">
    ${thumb}
    <div class="tb"><div class="t">${esc(r.title)}</div>
      <div class="l">${esc(r.bpm)} bpm</div>
      ${r.key ? `<div class="l">${esc(r.key)}</div>` : `<div class="l dim">no key</div>`}</div>
    <div class="track">${[0, 1, 2, 3].map(i => stationHtml(r, i)).join("")}
      ${r.state === "failed" && r.error ? `<div class="err">${esc(r.error)}</div>` : ""}</div>
    <div class="act">${actionHtml(r)}</div>
  </section>`;
}

function lum(hex) {
  const n = parseInt(String(hex).slice(1), 16);
  return isNaN(n) ? 0 : (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
}

function wire(row) {
  const slug = row.dataset.slug;
  const r = S.rows.find(x => x.slug === slug);
  for (const b of row.querySelectorAll("[data-run]")) b.onclick = () => run(JSON.parse(b.dataset.run));
  for (const b of row.querySelectorAll("[data-copy]")) b.onclick = async () => {
    await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Caption copied";
  };
  const input = row.querySelector("input[type=file]");
  if (input) input.onchange = () => input.files[0] && upload(slug, input.files[0]);
  if (!(r.status === "loop" && !r.has_recording)) return;
  row.ondragover = e => { e.preventDefault(); row.classList.add("drag"); };
  row.ondragleave = () => row.classList.remove("drag");
  row.ondrop = e => { e.preventDefault(); row.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) upload(slug, f); };
}

async function run(action) {
  const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(action) });
  if (!r.ok) logLocal((await r.json()).error || "could not start", true);
  loadState(); pollLog(true);
}

async function upload(slug, file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (!["mov", "mp4", "m4v"].includes(ext)) { logLocal(`${file.name} is not a .mov, .mp4 or .m4v file`, true); return; }
  uploading[slug] = file.name; render();
  try {
    const r = await fetch(`/api/inbox?slug=${encodeURIComponent(slug)}&ext=${ext}`, { method: "POST", headers: { "X-Beatpack": "1" }, body: file });
    if (!r.ok) logLocal((await r.json()).error, true);
  } finally { delete uploading[slug]; loadState(); pollLog(true); }
}

function logLocal(text, bad) { appendLog([text], bad); }

function appendLog(lines, bad) {
  const pre = $("#log"), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  for (const l of lines) {
    const span = document.createElement("span");
    span.className = l.startsWith("$ beatpack") ? "cmd" : (bad || /^(fail|error)\b/.test(l) ? "bad" : "");
    span.textContent = l + "\n";
    pre.appendChild(span);
    $("#loglast").textContent = l; logCount++;
  }
  $("#logn").textContent = logCount ? `${logCount} lines` : "";
  if (atEnd) pre.scrollTop = pre.scrollHeight;
}

let logTimer = null, wasRunning = false;
async function pollLog(now) {
  clearTimeout(logTimer);
  try {
    const r = await fetch(`/api/log?since=${logNext}`), j = await r.json();
    if (j.lines.length) appendLog(j.lines);
    logNext = j.next;
    $("#drawer").classList.toggle("running", j.running);
    $("#logk").textContent = j.running ? "running" : "log";
    if (j.running && (now || !wasRunning)) $("#drawer").open = true;
    if (wasRunning && !j.running) loadState();
    wasRunning = j.running;
    logTimer = setTimeout(pollLog, j.running ? 700 : 3000);
  } catch (e) { logTimer = setTimeout(pollLog, 5000); }
}

setInterval(() => { const t = elapsed(); for (const el of document.querySelectorAll(".elapsed")) el.textContent = t; }, 1000);
loadState(); pollLog();
</script>
</body>
</html>
